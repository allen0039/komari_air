name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      agent_version: ${{ steps.version.outputs.agent_value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION: $version" >&2; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          agent_version="$(tr -d '[:space:]' < AGENT_VERSION)"
          [[ "$agent_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid AGENT_VERSION: $agent_version" >&2; exit 1; }
          echo "agent_value=$agent_version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            docker.io/allen0039/komari_air:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
            ghcr.io/allen0039/komari_air:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            KOMARI_VERSION=${{ needs.prepare.outputs.version }}
            AGENT_VERSION=${{ needs.prepare.outputs.agent_version }}
            KOMARI_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-platform manifests
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for image in docker.io/allen0039/komari_air ghcr.io/allen0039/komari_air; do
            tags=(-t "$image:sha-${GITHUB_SHA:0:7}")
            if [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" == main ]]; then
              tags+=(-t "$image:latest")
            fi
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              tags+=(-t "$image:$GITHUB_REF_NAME" -t "$image:$VERSION")
            fi
            docker buildx imagetools create "${tags[@]}" \
              "$image:$BUILD_TAG-amd64" "$image:$BUILD_TAG-arm64"
            docker buildx imagetools inspect "$image:sha-${GITHUB_SHA:0:7}"
          done
