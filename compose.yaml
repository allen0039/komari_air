services:
  komari:
    image: ${KOMARI_IMAGE:-docker.io/allen0039/komari_air:latest}
    restart: unless-stopped
    environment:
      GIN_MODE: release
      KOMARI_LISTEN: 0.0.0.0:25774
      TZ: ${KOMARI_TZ:-Asia/Shanghai}
    ports:
      - "${KOMARI_PORT:-25774}:25774"
    volumes:
      # Keep data in the deployment directory for lossless in-place upgrades from official Komari.
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
